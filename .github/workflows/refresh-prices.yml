# Refreshes data/prices.json twice a day and commits it. The push makes
# Cloudflare rebuild and redeploy the site with the new prices.
# Needs the repository secret TRAVELPAYOUTS_TOKEN (Settings > Secrets and
# variables > Actions). Run it by hand from the Actions tab: "Refresh prices" >
# "Run workflow".
name: Refresh prices

on:
  schedule:
    # 05:17 and 17:17 UTC. Off the hour, when GitHub's scheduler is less busy.
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Refresh prices
        id: refresh
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "::error::The TRAVELPAYOUTS_TOKEN repository secret is not set."
            exit 1
          fi
          # Exit code 2 means some routes failed but prices.json was saved
          # (they keep their previous prices): commit anyway and warn.
          set +e
          npm run refresh:prices
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::Some routes failed to refresh and kept their previous prices. See the log above."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Commit and push
        run: |
          if git diff --quiet -- data/prices.json data/routes.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/routes.json
          git commit -m "Refresh prices"
          # Someone may have pushed during the refresh; replay on top of it.
          git pull --rebase origin main
          git push origin HEAD:main
